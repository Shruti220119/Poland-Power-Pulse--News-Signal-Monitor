name: Update live news feed

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes
  workflow_dispatch:            # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04       # pinned: avoids the Ubuntu 26 migration notice
    steps:
      - uses: actions/checkout@v5          # Node 24 version (no deprecation warning)

      - uses: actions/setup-python@v6      # Node 24 version
        with:
          python-version: "3.12"

      - name: Check repository files
        run: |
          echo "Files in repo:"; ls -R . | grep -v '^\./\.git' | head -50
          if [ ! -f scripts/feed_fetcher.py ]; then
            echo "::error::scripts/feed_fetcher.py is missing. Upload it into a folder named 'scripts' at the repo root."
            exit 1
          fi
          mkdir -p data
          [ -f data/signals.json ] || echo '{"updated": null, "signals": []}' > data/signals.json

      - name: Fetch live items
        run: python scripts/feed_fetcher.py

      - name: Commit only if the feed changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          if git diff --cached --quiet; then
            echo "No new items - nothing to commit."
            exit 0
          fi
          git commit -m "Live feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          git commit -m "Live feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
