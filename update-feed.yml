name: Update live feed

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:             # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch, filter and translate news
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: python scripts/feed_fetcher.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json data/feed_status.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Live feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
