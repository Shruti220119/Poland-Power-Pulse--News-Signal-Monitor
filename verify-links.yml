name: Verify headlines and links

on:
  schedule:
    - cron: "0 5 * * *"         # daily, 05:00 UTC (10:30 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every article link
        run: python scripts/verify_links.py

      - name: Commit link report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/headlines.json data/link_report.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Link check $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push
